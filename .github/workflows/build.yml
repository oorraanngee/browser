name: build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: atmo-windows
          path: target/release/atmo.exe
